    <text x="96" y="288" font-family="Aptos, Arial, sans-serif" font-size="25" fill="#334155"><tspan x="96" dy="0">全国 2.9 亿在校生面临&quot;千人一面&quot;的教学困境：同一进度、同一作业、同一反馈。每个学生的学习路径、薄弱点和理解节奏完全不同，但教育资源无法按需分配。</tspan></text>
