<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="{background}" /></g>
  <g id="chrome-stripe"><rect x="0" y="0" width="6" height="720" fill="{accent}" /></g>
  <g id="content-title">
    <text x="96" y="72" font-family="{font}" font-size="32" font-weight="700" fill="{text}">Trend Analysis</text>
    <rect x="96" y="82" width="60" height="3" fill="{accent}" />
  </g>
  <g id="content-body">
    <rect x="80" y="100" width="1120" height="560" rx="16" fill="{surface}" />
    <rect id="plot-area" x="160" y="130" width="960" height="420" fill="none" data-role="plot-area" />
    <!-- Grid -->
    <line x1="160" y1="550" x2="1120" y2="550" stroke="{text_tertiary}" stroke-width="1.5" />
    <line x1="160" y1="445" x2="1120" y2="445" stroke="{border}" stroke-opacity="0.2" />
    <line x1="160" y1="340" x2="1120" y2="340" stroke="{border}" stroke-opacity="0.2" />
    <line x1="160" y1="235" x2="1120" y2="235" stroke="{border}" stroke-opacity="0.2" />
    <line x1="160" y1="130" x2="1120" y2="130" stroke="{border}" stroke-opacity="0.2" />
    <!-- Line 1 -->
    <g id="line-series-1">
      <polyline points="200,445 360,380 520,400 680,300 840,250 1000,200 1080,180"
                fill="none" stroke="{accent}" stroke-width="3" stroke-linejoin="round" />
      <circle cx="200" cy="445" r="5" fill="{accent}" />
      <circle cx="360" cy="380" r="5" fill="{accent}" />
      <circle cx="520" cy="400" r="5" fill="{accent}" />
      <circle cx="680" cy="300" r="5" fill="{accent}" />
      <circle cx="840" cy="250" r="5" fill="{accent}" />
      <circle cx="1000" cy="200" r="5" fill="{accent}" />
      <circle cx="1080" cy="180" r="5" fill="{accent}" />
    </g>
    <!-- Line 2 -->
    <g id="line-series-2">
      <polyline points="200,500 360,470 520,450 680,430 840,400 1000,380 1080,350"
                fill="none" stroke="{secondary_accent}" stroke-width="3" stroke-dasharray="8,4" stroke-linejoin="round" />
      <circle cx="200" cy="500" r="5" fill="{secondary_accent}" />
      <circle cx="360" cy="470" r="5" fill="{secondary_accent}" />
      <circle cx="520" cy="450" r="5" fill="{secondary_accent}" />
      <circle cx="680" cy="430" r="5" fill="{secondary_accent}" />
      <circle cx="840" cy="400" r="5" fill="{secondary_accent}" />
      <circle cx="1000" cy="380" r="5" fill="{secondary_accent}" />
      <circle cx="1080" cy="350" r="5" fill="{secondary_accent}" />
    </g>
    <!-- X-axis labels -->
    <text x="200" y="580" font-family="{font}" font-size="13" fill="{text_secondary}" text-anchor="middle">Jan</text>
    <text x="360" y="580" font-family="{font}" font-size="13" fill="{text_secondary}" text-anchor="middle">Feb</text>
    <text x="520" y="580" font-family="{font}" font-size="13" fill="{text_secondary}" text-anchor="middle">Mar</text>
    <text x="680" y="580" font-family="{font}" font-size="13" fill="{text_secondary}" text-anchor="middle">Apr</text>
    <text x="840" y="580" font-family="{font}" font-size="13" fill="{text_secondary}" text-anchor="middle">May</text>
    <text x="1000" y="580" font-family="{font}" font-size="13" fill="{text_secondary}" text-anchor="middle">Jun</text>
    <text x="1080" y="580" font-family="{font}" font-size="13" fill="{text_secondary}" text-anchor="middle">Jul</text>
    <!-- Legend -->
    <g id="legend">
      <line x1="820" y1="620" x2="850" y2="620" stroke="{accent}" stroke-width="3" />
      <text x="860" y="625" font-family="{font}" font-size="13" fill="{text_secondary}">Actual</text>
      <line x1="940" y1="620" x2="970" y2="620" stroke="{secondary_accent}" stroke-width="3" stroke-dasharray="8,4" />
      <text x="980" y="625" font-family="{font}" font-size="13" fill="{text_secondary}">Target</text>
    </g>
  </g>
  <g id="chrome-footer">
    <rect x="0" y="688" width="1280" height="32" fill="{surface}" />
    <text x="1184" y="708" font-family="{font}" font-size="12" fill="{muted}" text-anchor="end">NN / TT</text>
  </g>
</svg>
