<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="{background}" /></g>
  <g id="chrome-stripe"><rect x="0" y="0" width="6" height="720" fill="{accent}" /></g>
  <g id="content-title">
    <text x="96" y="72" font-family="{font}" font-size="32" font-weight="700" fill="{text}">Chart Title</text>
    <rect x="96" y="82" width="60" height="3" fill="{accent}" />
  </g>
  <g id="content-body">
    <rect x="80" y="100" width="1120" height="560" rx="16" fill="{surface}" />
    <rect id="plot-area" x="160" y="130" width="960" height="420" fill="none" data-role="plot-area" />
    <!-- Y-axis labels -->
    <text x="140" y="135" font-family="{font}" font-size="12" fill="{text_tertiary}" text-anchor="end">100</text>
    <text x="140" y="240" font-family="{font}" font-size="12" fill="{text_tertiary}" text-anchor="end">75</text>
    <text x="140" y="345" font-family="{font}" font-size="12" fill="{text_tertiary}" text-anchor="end">50</text>
    <text x="140" y="450" font-family="{font}" font-size="12" fill="{text_tertiary}" text-anchor="end">25</text>
    <text x="140" y="550" font-family="{font}" font-size="12" fill="{text_tertiary}" text-anchor="end">0</text>
    <!-- Grid lines -->
    <line x1="160" y1="130" x2="1120" y2="130" stroke="{border}" stroke-opacity="0.2" />
    <line x1="160" y1="235" x2="1120" y2="235" stroke="{border}" stroke-opacity="0.2" />
    <line x1="160" y1="340" x2="1120" y2="340" stroke="{border}" stroke-opacity="0.2" />
    <line x1="160" y1="445" x2="1120" y2="445" stroke="{border}" stroke-opacity="0.2" />
    <!-- Baseline -->
    <line x1="160" y1="550" x2="1120" y2="550" stroke="{text_tertiary}" stroke-width="1.5" />
    <!-- Bars -->
    <g id="bar-1" data-anim-order="1">
      <rect x="200" y="235" width="80" height="315" rx="4" fill="{accent}" />
      <text x="240" y="220" font-family="{font}" font-size="14" fill="{text}" text-anchor="middle">75</text>
    </g>
    <g id="bar-2" data-anim-order="2">
      <rect x="360" y="172" width="80" height="378" rx="4" fill="{accent}" />
      <text x="400" y="158" font-family="{font}" font-size="14" fill="{text}" text-anchor="middle">90</text>
    </g>
    <g id="bar-3" data-anim-order="3">
      <rect x="520" y="298" width="80" height="252" rx="4" fill="{secondary_accent}" />
      <text x="560" y="284" font-family="{font}" font-size="14" fill="{text}" text-anchor="middle">60</text>
    </g>
    <g id="bar-4" data-anim-order="4">
      <rect x="680" y="130" width="80" height="420" rx="4" fill="{accent}" />
      <text x="720" y="116" font-family="{font}" font-size="14" fill="{text}" text-anchor="middle">100</text>
    </g>
    <g id="bar-5" data-anim-order="5">
      <rect x="840" y="256" width="80" height="294" rx="4" fill="{secondary_accent}" />
      <text x="880" y="242" font-family="{font}" font-size="14" fill="{text}" text-anchor="middle">70</text>
    </g>
    <g id="bar-6" data-anim-order="6">
      <rect x="1000" y="193" width="80" height="357" rx="4" fill="{accent}" />
      <text x="1040" y="180" font-family="{font}" font-size="14" fill="{text}" text-anchor="middle">85</text>
    </g>
    <!-- X-axis labels -->
    <text x="240" y="580" font-family="{font}" font-size="14" fill="{text_secondary}" text-anchor="middle">Jan</text>
    <text x="400" y="580" font-family="{font}" font-size="14" fill="{text_secondary}" text-anchor="middle">Feb</text>
    <text x="560" y="580" font-family="{font}" font-size="14" fill="{text_secondary}" text-anchor="middle">Mar</text>
    <text x="720" y="580" font-family="{font}" font-size="14" fill="{text_secondary}" text-anchor="middle">Apr</text>
    <text x="880" y="580" font-family="{font}" font-size="14" fill="{text_secondary}" text-anchor="middle">May</text>
    <text x="1040" y="580" font-family="{font}" font-size="14" fill="{text_secondary}" text-anchor="middle">Jun</text>
  </g>
  <g id="chrome-footer">
    <rect x="0" y="688" width="1280" height="32" fill="{surface}" />
    <text x="1184" y="708" font-family="{font}" font-size="12" fill="{muted}" text-anchor="end">NN / TT</text>
  </g>
</svg>
