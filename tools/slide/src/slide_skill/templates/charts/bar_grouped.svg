<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="{background}" /></g>
  <g id="chrome-stripe"><rect x="0" y="0" width="6" height="720" fill="{accent}" /></g>
  <g id="content-title">
    <text x="96" y="72" font-family="{font}" font-size="32" font-weight="700" fill="{text}">Grouped Comparison</text>
    <rect x="96" y="82" width="60" height="3" fill="{accent}" />
  </g>
  <g id="content-body">
    <rect x="80" y="100" width="1120" height="560" rx="16" fill="{surface}" />
    <rect id="plot-area" x="160" y="130" width="960" height="400" fill="none" data-role="plot-area" />
    <!-- Grid -->
    <line x1="160" y1="530" x2="1120" y2="530" stroke="{text_tertiary}" stroke-width="1.5" />
    <line x1="160" y1="430" x2="1120" y2="430" stroke="{border}" stroke-opacity="0.2" />
    <line x1="160" y1="330" x2="1120" y2="330" stroke="{border}" stroke-opacity="0.2" />
    <line x1="160" y1="230" x2="1120" y2="230" stroke="{border}" stroke-opacity="0.2" />
    <line x1="160" y1="130" x2="1120" y2="130" stroke="{border}" stroke-opacity="0.2" />
    <!-- Group 1 -->
    <g id="group-1" data-anim-order="1">
      <rect x="220" y="230" width="60" height="300" rx="4" fill="{accent}" />
      <rect x="290" y="330" width="60" height="200" rx="4" fill="{secondary_accent}" />
      <text x="285" y="565" font-family="{font}" font-size="14" fill="{text_secondary}" text-anchor="middle">Q1</text>
    </g>
    <!-- Group 2 -->
    <g id="group-2" data-anim-order="2">
      <rect x="440" y="180" width="60" height="350" rx="4" fill="{accent}" />
      <rect x="510" y="280" width="60" height="250" rx="4" fill="{secondary_accent}" />
      <text x="505" y="565" font-family="{font}" font-size="14" fill="{text_secondary}" text-anchor="middle">Q2</text>
    </g>
    <!-- Group 3 -->
    <g id="group-3" data-anim-order="3">
      <rect x="660" y="280" width="60" height="250" rx="4" fill="{accent}" />
      <rect x="730" y="230" width="60" height="300" rx="4" fill="{secondary_accent}" />
      <text x="725" y="565" font-family="{font}" font-size="14" fill="{text_secondary}" text-anchor="middle">Q3</text>
    </g>
    <!-- Group 4 -->
    <g id="group-4" data-anim-order="4">
      <rect x="880" y="130" width="60" height="400" rx="4" fill="{accent}" />
      <rect x="950" y="180" width="60" height="350" rx="4" fill="{secondary_accent}" />
      <text x="945" y="565" font-family="{font}" font-size="14" fill="{text_secondary}" text-anchor="middle">Q4</text>
    </g>
    <!-- Legend -->
    <g id="legend">
      <rect x="820" y="600" width="16" height="16" rx="3" fill="{accent}" />
      <text x="844" y="614" font-family="{font}" font-size="13" fill="{text_secondary}">Series A</text>
      <rect x="940" y="600" width="16" height="16" rx="3" fill="{secondary_accent}" />
      <text x="964" y="614" font-family="{font}" font-size="13" fill="{text_secondary}">Series B</text>
    </g>
  </g>
  <g id="chrome-footer">
    <rect x="0" y="688" width="1280" height="32" fill="{surface}" />
    <text x="1184" y="708" font-family="{font}" font-size="12" fill="{muted}" text-anchor="end">NN / TT</text>
  </g>
</svg>
