<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="{background}" /></g>
  <g id="chrome-stripe"><rect x="0" y="0" width="6" height="720" fill="{accent}" /></g>
  <g id="content-title">
    <text x="96" y="72" font-family="{font}" font-size="32" font-weight="700" fill="{text}">Data Summary</text>
    <rect x="96" y="82" width="60" height="3" fill="{accent}" />
  </g>
  <g id="content-body">
    <rect x="80" y="100" width="1120" height="560" rx="16" fill="{surface}" />
    <!-- Table header -->
    <rect x="80" y="100" width="1120" height="48" rx="16" fill="{accent}" />
    <rect x="80" y="132" width="1120" height="16" fill="{accent}" />
    <text x="160" y="130" font-family="{font}" font-size="16" font-weight="700" fill="{background}">Item</text>
    <text x="480" y="130" font-family="{font}" font-size="16" font-weight="700" fill="{background}" text-anchor="middle">Value</text>
    <text x="720" y="130" font-family="{font}" font-size="16" font-weight="700" fill="{background}" text-anchor="middle">Change</text>
    <text x="960" y="130" font-family="{font}" font-size="16" font-weight="700" fill="{background}" text-anchor="middle">Status</text>
    <!-- Row 1 -->
    <g id="row-1">
      <rect x="80" y="148" width="1120" height="56" fill="{surface}" />
      <text x="160" y="182" font-family="{font}" font-size="16" fill="{text}">Row item 1</text>
      <text x="480" y="182" font-family="{font}" font-size="16" fill="{text_secondary}" text-anchor="middle">1,234</text>
      <text x="720" y="182" font-family="{font}" font-size="16" fill="{accent}" text-anchor="middle">+12.5%</text>
      <circle cx="960" cy="176" r="6" fill="{accent}" />
    </g>
    <!-- Row 2 -->
    <g id="row-2">
      <rect x="80" y="204" width="1120" height="56" fill="{bg_secondary}" />
      <text x="160" y="238" font-family="{font}" font-size="16" fill="{text}">Row item 2</text>
      <text x="480" y="238" font-family="{font}" font-size="16" fill="{text_secondary}" text-anchor="middle">5,678</text>
      <text x="720" y="238" font-family="{font}" font-size="16" fill="{accent}" text-anchor="middle">+8.3%</text>
      <circle cx="960" cy="232" r="6" fill="{accent}" />
    </g>
    <!-- Row 3 -->
    <g id="row-3">
      <rect x="80" y="260" width="1120" height="56" fill="{surface}" />
      <text x="160" y="294" font-family="{font}" font-size="16" fill="{text}">Row item 3</text>
      <text x="480" y="294" font-family="{font}" font-size="16" fill="{text_secondary}" text-anchor="middle">910</text>
      <text x="720" y="294" font-family="{font}" font-size="16" fill="{secondary_accent}" text-anchor="middle">-3.2%</text>
      <circle cx="960" cy="288" r="6" fill="{secondary_accent}" />
    </g>
    <!-- Row 4 -->
    <g id="row-4">
      <rect x="80" y="316" width="1120" height="56" fill="{bg_secondary}" />
      <text x="160" y="350" font-family="{font}" font-size="16" fill="{text}">Row item 4</text>
      <text x="480" y="350" font-family="{font}" font-size="16" fill="{text_secondary}" text-anchor="middle">3,456</text>
      <text x="720" y="350" font-family="{font}" font-size="16" fill="{accent}" text-anchor="middle">+15.7%</text>
      <circle cx="960" cy="344" r="6" fill="{accent}" />
    </g>
    <!-- Row 5 -->
    <g id="row-5">
      <rect x="80" y="372" width="1120" height="56" fill="{surface}" />
      <text x="160" y="406" font-family="{font}" font-size="16" fill="{text}">Row item 5</text>
      <text x="480" y="406" font-family="{font}" font-size="16" fill="{text_secondary}" text-anchor="middle">789</text>
      <text x="720" y="406" font-family="{font}" font-size="16" fill="{secondary_accent}" text-anchor="middle">-1.1%</text>
      <circle cx="960" cy="400" r="6" fill="{muted}" />
    </g>
  </g>
  <g id="chrome-footer">
    <rect x="0" y="688" width="1280" height="32" fill="{surface}" />
    <text x="1184" y="708" font-family="{font}" font-size="12" fill="{muted}" text-anchor="end">NN / TT</text>
  </g>
</svg>
