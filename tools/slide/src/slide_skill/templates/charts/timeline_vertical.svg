<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="{background}" />
      <stop offset="100%" stop-color="{bg_secondary}" />
    </linearGradient>
  </defs>

  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="url(#bg-grad)" />
  </g>

  <g id="chrome-stripe">
    <rect x="0" y="0" width="6" height="720" fill="{accent}" />
  </g>

  <g id="content-title">
    <text x="96" y="72" font-family="{font}" font-size="32" font-weight="700" fill="{text}">Timeline Title</text>
    <rect x="96" y="82" width="60" height="3" fill="{accent}" />
  </g>

  <g id="content-body">
    <!-- Vertical track line -->
    <line x1="200" y1="120" x2="200" y2="640" stroke="{border}" stroke-width="3" stroke-linecap="round" />

    <!-- Node 1 -->
    <g id="node-1" data-anim-order="1">
      <circle cx="200" cy="160" r="12" fill="{accent}" />
      <rect x="240" y="136" width="900" height="64" rx="12" fill="{surface}" />
      <text x="264" y="162" font-family="{font}" font-size="16" font-weight="700" fill="{text}">Phase 1 — Title</text>
      <text x="264" y="186" font-family="{font}" font-size="14" fill="{text_secondary}">Description of this phase milestone</text>
    </g>

    <!-- Node 2 -->
    <g id="node-2" data-anim-order="2">
      <circle cx="200" cy="280" r="12" fill="{accent}" />
      <rect x="240" y="256" width="900" height="64" rx="12" fill="{surface}" />
      <text x="264" y="282" font-family="{font}" font-size="16" font-weight="700" fill="{text}">Phase 2 — Title</text>
      <text x="264" y="306" font-family="{font}" font-size="14" fill="{text_secondary}">Description of this phase milestone</text>
    </g>

    <!-- Node 3 -->
    <g id="node-3" data-anim-order="3">
      <circle cx="200" cy="400" r="12" fill="{secondary_accent}" />
      <rect x="240" y="376" width="900" height="64" rx="12" fill="{surface}" />
      <text x="264" y="402" font-family="{font}" font-size="16" font-weight="700" fill="{text}">Phase 3 — Title</text>
      <text x="264" y="426" font-family="{font}" font-size="14" fill="{text_secondary}">Description of this phase milestone</text>
    </g>

    <!-- Node 4 -->
    <g id="node-4" data-anim-order="4">
      <circle cx="200" cy="520" r="12" fill="{muted}" />
      <rect x="240" y="496" width="900" height="64" rx="12" fill="{surface}" />
      <text x="264" y="522" font-family="{font}" font-size="16" font-weight="700" fill="{text}">Phase 4 — Title</text>
      <text x="264" y="546" font-family="{font}" font-size="14" fill="{text_secondary}">Description of this phase milestone</text>
    </g>
  </g>

  <g id="chrome-footer">
    <rect x="0" y="688" width="1280" height="32" fill="{surface}" />
    <text x="1184" y="708" font-family="{font}" font-size="12" fill="{muted}" text-anchor="end">NN / TT</text>
  </g>
</svg>
