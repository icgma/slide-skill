<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="{background}" /></g>
  <g id="content-title-NN">
    <text x="640" y="72" font-family="{font}" font-size="18" font-weight="600" fill="{text_secondary}" text-anchor="middle">Figure N. Descriptive caption</text>
  </g>
  <g id="content-body-NN">
    <rect x="140" y="100" width="1000" height="540" rx="8" fill="{surface}" stroke="{border}" stroke-width="1" />
    <text x="640" y="380" font-family="{font}" font-size="18" fill="{text_tertiary}" text-anchor="middle">[Figure / diagram area]</text>
  </g>
  <g id="content-source">
    <text x="640" y="665" font-family="{font}" font-size="12" fill="{text_tertiary}" text-anchor="middle" font-style="italic">Source: Adapted from Author (Year)</text>
  </g>
  <g id="chrome-stripe"><rect x="0" y="0" width="6" height="720" fill="{accent}" /></g>
  <g id="chrome-footer">
    <rect x="0" y="688" width="1280" height="32" fill="{surface}" />
    <text x="1184" y="708" font-family="{font}" font-size="12" fill="{muted}" text-anchor="end">NN / TT</text>
  </g>
</svg>
