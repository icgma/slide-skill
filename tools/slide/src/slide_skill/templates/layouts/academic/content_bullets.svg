<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="{background}" /></g>
  <g id="content-title-NN">
    <text x="96" y="80" font-family="{font}" font-size="36" font-weight="700" fill="{text}">Academic Slide Title</text>
    <line x1="96" y1="92" x2="400" y2="92" stroke="{accent}" stroke-width="2" />
  </g>
  <g id="content-body-NN">
    <text x="120" y="140" font-family="{font}" font-size="20" fill="{text_secondary}">• Finding or point with scholarly detail</text>
    <text x="120" y="180" font-family="{font}" font-size="20" fill="{text_secondary}">• Second finding with evidence reference</text>
    <text x="120" y="220" font-family="{font}" font-size="20" fill="{text_secondary}">• Third finding with statistical support</text>
    <text x="120" y="260" font-family="{font}" font-size="20" fill="{text_secondary}">• Fourth finding with methodological note</text>
  </g>
  <g id="content-citation">
    <text x="96" y="640" font-family="{font}" font-size="13" fill="{text_tertiary}" font-style="italic">Source: Author (Year). Study title. Journal Name, Vol(Issue), pp.</text>
  </g>
  <g id="chrome-stripe"><rect x="0" y="0" width="6" height="720" fill="{accent}" /></g>
  <g id="chrome-footer">
    <rect x="0" y="688" width="1280" height="32" fill="{surface}" />
    <text x="1184" y="708" font-family="{font}" font-size="12" fill="{muted}" text-anchor="end">NN / TT</text>
  </g>
</svg>
