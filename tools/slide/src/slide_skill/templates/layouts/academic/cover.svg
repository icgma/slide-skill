<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background">
    <rect x="0" y="0" width="1280" height="720" fill="{background}" />
    <line x1="96" y1="460" x2="1184" y2="460" stroke="{border}" stroke-width="2" />
  </g>
  <g id="content-title-01">
    <text x="96" y="280" font-family="{font}" font-size="48" font-weight="700" fill="{text}">Research Paper Title</text>
    <text x="96" y="330" font-family="{font}" font-size="28" fill="{text_secondary}">Subtitle or Investigation Focus</text>
    <text x="96" y="500" font-family="{font}" font-size="20" fill="{text_secondary}">Author Name, Ph.D.</text>
    <text x="96" y="530" font-family="{font}" font-size="18" fill="{text_tertiary}">Department · University · Date</text>
  </g>
  <g id="chrome-stripe"><rect x="0" y="0" width="6" height="720" fill="{accent}" /></g>
  <g id="chrome-footer">
    <rect x="0" y="688" width="1280" height="32" fill="{surface}" />
    <text x="1184" y="708" font-family="{font}" font-size="12" fill="{muted}" text-anchor="end">NN / TT</text>
  </g>
</svg>
