<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="{background}" /></g>
  <g id="content-quote-NN">
    <text x="160" y="260" font-family="{font}" font-size="180" font-weight="700" fill="{accent}" fill-opacity="0.15">"</text>
    <text x="200" y="360" font-family="{font}" font-size="40" font-style="italic" fill="{text}">Inspirational or key quote</text>
    <text x="200" y="410" font-family="{font}" font-size="40" font-style="italic" fill="{text}">that spans two lines.</text>
    <rect x="200" y="440" width="80" height="4" fill="{accent}" />
    <text x="200" y="490" font-family="{font}" font-size="20" fill="{text_secondary}">— Attribution</text>
  </g>
  <g id="chrome-stripe"><rect x="0" y="0" width="6" height="720" fill="{accent}" /></g>
  <g id="chrome-footer">
    <rect x="0" y="688" width="1280" height="32" fill="{surface}" />
    <text x="1184" y="708" font-family="{font}" font-size="12" fill="{muted}" text-anchor="end">NN / TT</text>
  </g>
</svg>
