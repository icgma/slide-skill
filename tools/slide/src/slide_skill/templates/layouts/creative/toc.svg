<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="{background}" /></g>
  <g id="content-title-NN">
    <text x="120" y="120" font-family="{font}" font-size="48" font-weight="700" fill="{text}">Contents</text>
  </g>
  <g id="content-body-NN">
    <text x="120" y="220" font-family="{font}" font-size="64" font-weight="700" fill="{accent}" fill-opacity="0.3">01</text>
    <text x="220" y="220" font-family="{font}" font-size="24" fill="{text}">The Vision</text>
    <text x="120" y="310" font-family="{font}" font-size="64" font-weight="700" fill="{accent}" fill-opacity="0.3">02</text>
    <text x="220" y="310" font-family="{font}" font-size="24" fill="{text}">The Journey</text>
    <text x="120" y="400" font-family="{font}" font-size="64" font-weight="700" fill="{accent}" fill-opacity="0.3">03</text>
    <text x="220" y="400" font-family="{font}" font-size="24" fill="{text}">The Impact</text>
    <text x="120" y="490" font-family="{font}" font-size="64" font-weight="700" fill="{accent}" fill-opacity="0.3">04</text>
    <text x="220" y="490" font-family="{font}" font-size="24" fill="{text}">What's Next</text>
  </g>
  <g id="chrome-stripe"><rect x="0" y="0" width="6" height="720" fill="{accent}" /></g>
  <g id="chrome-footer">
    <rect x="0" y="688" width="1280" height="32" fill="{surface}" />
    <text x="1184" y="708" font-family="{font}" font-size="12" fill="{muted}" text-anchor="end">NN / TT</text>
  </g>
</svg>
