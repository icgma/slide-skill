<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="{background}" /></g>
  <g id="content-title-NN">
    <text x="640" y="72" font-family="{font}" font-size="32" font-weight="700" fill="{text}" text-anchor="middle">Gallery</text>
  </g>
  <g id="gallery-grid">
    <rect x="80" y="100" width="372" height="272" rx="16" fill="{surface}" />
    <text x="266" y="240" font-family="{font}" font-size="16" fill="{text_tertiary}" text-anchor="middle">[Image 1]</text>
    <rect x="468" y="100" width="352" height="272" rx="16" fill="{surface}" />
    <text x="644" y="240" font-family="{font}" font-size="16" fill="{text_tertiary}" text-anchor="middle">[Image 2]</text>
    <rect x="836" y="100" width="372" height="272" rx="16" fill="{surface}" />
    <text x="1022" y="240" font-family="{font}" font-size="16" fill="{text_tertiary}" text-anchor="middle">[Image 3]</text>
    <rect x="80" y="388" width="560" height="272" rx="16" fill="{surface}" />
    <text x="360" y="528" font-family="{font}" font-size="16" fill="{text_tertiary}" text-anchor="middle">[Image 4]</text>
    <rect x="656" y="388" width="552" height="272" rx="16" fill="{surface}" />
    <text x="932" y="528" font-family="{font}" font-size="16" fill="{text_tertiary}" text-anchor="middle">[Image 5]</text>
  </g>
  <g id="chrome-stripe"><rect x="0" y="0" width="6" height="720" fill="{accent}" /></g>
  <g id="chrome-footer">
    <rect x="0" y="688" width="1280" height="32" fill="{surface}" />
    <text x="1184" y="708" font-family="{font}" font-size="12" fill="{muted}" text-anchor="end">NN / TT</text>
  </g>
</svg>
