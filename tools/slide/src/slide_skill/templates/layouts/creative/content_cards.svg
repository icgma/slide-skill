<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="{background}" /></g>
  <g id="content-title-NN">
    <text x="640" y="80" font-family="{font}" font-size="40" font-weight="700" fill="{text}" text-anchor="middle">Features</text>
  </g>
  <g id="card-1">
    <rect x="80" y="120" width="352" height="520" rx="20" fill="{surface}" />
    <rect x="80" y="120" width="352" height="6" rx="3" fill="{accent}" />
    <text x="256" y="300" font-family="{font}" font-size="24" font-weight="700" fill="{text}" text-anchor="middle">Card 1</text>
    <text x="256" y="340" font-family="{font}" font-size="16" fill="{text_secondary}" text-anchor="middle">Description text</text>
  </g>
  <g id="card-2">
    <rect x="464" y="120" width="352" height="520" rx="20" fill="{surface}" />
    <rect x="464" y="120" width="352" height="6" rx="3" fill="{secondary_accent}" />
    <text x="640" y="300" font-family="{font}" font-size="24" font-weight="700" fill="{text}" text-anchor="middle">Card 2</text>
    <text x="640" y="340" font-family="{font}" font-size="16" fill="{text_secondary}" text-anchor="middle">Description text</text>
  </g>
  <g id="card-3">
    <rect x="848" y="120" width="352" height="520" rx="20" fill="{surface}" />
    <rect x="848" y="120" width="352" height="6" rx="3" fill="{accent}" fill-opacity="0.6" />
    <text x="1024" y="300" font-family="{font}" font-size="24" font-weight="700" fill="{text}" text-anchor="middle">Card 3</text>
    <text x="1024" y="340" font-family="{font}" font-size="16" fill="{text_secondary}" text-anchor="middle">Description text</text>
  </g>
  <g id="chrome-stripe"><rect x="0" y="0" width="6" height="720" fill="{accent}" /></g>
  <g id="chrome-footer">
    <rect x="0" y="688" width="1280" height="32" fill="{surface}" />
    <text x="1184" y="708" font-family="{font}" font-size="12" fill="{muted}" text-anchor="end">NN / TT</text>
  </g>
</svg>
