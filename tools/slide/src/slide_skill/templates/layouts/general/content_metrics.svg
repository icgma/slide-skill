<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="{background}" /></g>
  <g id="content-title-NN">
    <text x="96" y="100" font-family="{font}" font-size="40" font-weight="700" fill="{text}">Key Numbers</text>
    <rect x="96" y="112" width="80" height="4" fill="{accent}" />
  </g>
  <g id="content-metric-NN">
    <rect x="80" y="148" width="356" height="480" rx="16" fill="{surface}" />
    <text x="258" y="380" font-family="{font}" font-size="72" font-weight="700" fill="{accent}" text-anchor="middle">85%</text>
    <text x="258" y="430" font-family="{font}" font-size="18" fill="{text_secondary}" text-anchor="middle">Metric A</text>
    <rect x="460" y="148" width="356" height="480" rx="16" fill="{surface}" />
    <text x="638" y="380" font-family="{font}" font-size="72" font-weight="700" fill="{accent}" text-anchor="middle">2.4K</text>
    <text x="638" y="430" font-family="{font}" font-size="18" fill="{text_secondary}" text-anchor="middle">Metric B</text>
    <rect x="840" y="148" width="356" height="480" rx="16" fill="{surface}" />
    <text x="1018" y="380" font-family="{font}" font-size="72" font-weight="700" fill="{secondary_accent}" text-anchor="middle">$1.2M</text>
    <text x="1018" y="430" font-family="{font}" font-size="18" fill="{text_secondary}" text-anchor="middle">Metric C</text>
  </g>
  <g id="chrome-stripe"><rect x="0" y="0" width="6" height="720" fill="{accent}" /></g>
  <g id="chrome-footer">
    <rect x="0" y="688" width="1280" height="32" fill="{surface}" />
    <text x="1184" y="708" font-family="{font}" font-size="12" fill="{muted}" text-anchor="end">NN / TT</text>
  </g>
</svg>
