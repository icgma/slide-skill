<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="{background}" /></g>
  <g id="content-title-NN">
    <text x="700" y="140" font-family="{font}" font-size="36" font-weight="700" fill="{text}">Image + Content</text>
    <rect x="700" y="152" width="60" height="3" fill="{accent}" />
  </g>
  <g id="content-image-NN">
    <rect x="80" y="100" width="560" height="560" rx="16" fill="{surface}" />
    <text x="360" y="390" font-family="{font}" font-size="20" fill="{text_tertiary}" text-anchor="middle">[Image placeholder]</text>
  </g>
  <g id="content-body-NN">
    <text x="700" y="200" font-family="{font}" font-size="18" fill="{text_secondary}">Body content alongside image.</text>
    <text x="700" y="236" font-family="{font}" font-size="18" fill="{text_secondary}">Additional details here.</text>
  </g>
  <g id="chrome-stripe"><rect x="0" y="0" width="6" height="720" fill="{accent}" /></g>
  <g id="chrome-footer">
    <rect x="0" y="688" width="1280" height="32" fill="{surface}" />
    <text x="1184" y="708" font-family="{font}" font-size="12" fill="{muted}" text-anchor="end">NN / TT</text>
  </g>
</svg>
