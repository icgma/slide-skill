<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="{background}" /></g>
  <g id="content-title-NN">
    <text x="96" y="100" font-family="{font}" font-size="40" font-weight="700" fill="{text}">Slide Title</text>
    <rect x="96" y="112" width="80" height="4" fill="{accent}" />
  </g>
  <g id="content-body-NN">
    <rect x="80" y="140" width="1120" height="56" rx="8" fill="{surface}" />
    <text x="120" y="175" font-family="{font}" font-size="22" fill="{accent}">&#x2022;</text>
    <text x="148" y="175" font-family="{font}" font-size="22" fill="{text_secondary}">First bullet point</text>
    <rect x="80" y="204" width="1120" height="56" rx="8" fill="{bg_secondary}" />
    <text x="120" y="239" font-family="{font}" font-size="22" fill="{accent}">&#x2022;</text>
    <text x="148" y="239" font-family="{font}" font-size="22" fill="{text_secondary}">Second bullet point</text>
    <rect x="80" y="268" width="1120" height="56" rx="8" fill="{surface}" />
    <text x="120" y="303" font-family="{font}" font-size="22" fill="{accent}">&#x2022;</text>
    <text x="148" y="303" font-family="{font}" font-size="22" fill="{text_secondary}">Third bullet point</text>
  </g>
  <g id="chrome-stripe"><rect x="0" y="0" width="6" height="720" fill="{accent}" /></g>
  <g id="chrome-footer">
    <rect x="0" y="688" width="1280" height="32" fill="{surface}" />
    <text x="1184" y="708" font-family="{font}" font-size="12" fill="{muted}" text-anchor="end">NN / TT</text>
  </g>
</svg>
