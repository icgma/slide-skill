<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="close-grad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="{surface}" />
      <stop offset="100%" stop-color="{background}" />
    </radialGradient>
  </defs>
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="{background}" /></g>
  <g id="content-title-NN">
    <text x="640" y="300" font-family="{font}" font-size="72" font-weight="700" fill="{text}" text-anchor="middle">Thank You</text>
    <rect x="490" y="318" width="300" height="4" fill="{accent}" />
    <text x="640" y="380" font-family="{font}" font-size="22" fill="{text_secondary}" text-anchor="middle">Contact · Email · Website</text>
  </g>
  <g id="chrome-stripe"><rect x="0" y="0" width="6" height="720" fill="{accent}" /></g>
  <g id="chrome-footer">
    <rect x="0" y="688" width="1280" height="32" fill="{surface}" />
    <text x="1184" y="708" font-family="{font}" font-size="12" fill="{muted}" text-anchor="end">NN / TT</text>
  </g>
</svg>
