    <text x="70" y="232" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="14" font-weight="700" fill="#2758E2" letter-spacing="4">FRICTION</text>
    <text x="70" y="322" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="52" font-weight="800" fill="#0F172A">讨论问题</text>
    <text x="70" y="446" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="18" fill="#334155" opacity="0.8">3 mapped signals</text>
    <rect x="640" y="150" width="563" height="96" rx="24" fill="#F8FAFC" fill-opacity="1" stroke="#1546D0" stroke-opacity="0.24" stroke-width="1.5" filter="url(#card-shadow-09)"/>
    <text x="660" y="184" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="16" font-weight="800" fill="#1546D0">! 01</text>
    <text x="660" y="222" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="18" font-weight="700" fill="#0F172A" data-fit-box="660,198,521,38" data-line-height="1.18"><tspan x="660" dy="0">如果由你设计目标函数，你会在&quot;用户时长&quot;之外加入什么指标？</tspan></text>
    <rect x="640" y="264" width="563" height="96" rx="24" fill="#F8FAFC" fill-opacity="1" stroke="#2758E2" stroke-opacity="0.24" stroke-width="1.5" filter="url(#card-shadow-09)"/>
    <text x="660" y="298" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="16" font-weight="800" fill="#2758E2">! 02</text>
    <text x="660" y="336" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="20" font-weight="700" fill="#0F172A" data-fit-box="660,312,521,38" data-line-height="1.18"><tspan x="660" dy="0">&quot;可关闭个性化推荐&quot;上线后使用率不足 4%，说明了什么？</tspan></text>
    <rect x="640" y="378" width="563" height="96" rx="24" fill="#F8FAFC" fill-opacity="1" stroke="#396AF4" stroke-opacity="0.24" stroke-width="1.5" filter="url(#card-shadow-09)"/>
    <text x="660" y="412" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="16" font-weight="800" fill="#3B6CF6">! 03</text>
    <text x="660" y="450" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="20" font-weight="700" fill="#0F172A" data-fit-box="660,426,521,38" data-line-height="1.18"><tspan x="660" dy="0">创作者为流量池数据优化前 3 秒，算不算被算法&quot;驯化&quot;？</tspan></text>
