<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="row-grad-08" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8FAFC"/>
      <stop offset="100%" stop-color="#F8FAFC" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="card-shadow-08" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.10" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb-08" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2-08" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#4576FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4576FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="decor-08">
    <ellipse cx="1240" cy="30" rx="400" ry="280" fill="url(#orb-08)"/>
    <ellipse cx="60" cy="690" rx="280" ry="200" fill="url(#orb2-08)"/>
    <line x1="1280" y1="0" x2="1080" y2="180" stroke="#1D4ED8" stroke-width="2" opacity="0.12"/>
    <line x1="1280" y1="0" x2="1140" y2="120" stroke="#1D4ED8" stroke-width="1" opacity="0.08"/>
  </g>
  <g id="decor-bar-08">
    <rect x="1232" y="0" width="48" height="720" fill="#1D4ED8" opacity="0.04"/>
  </g>
  <defs>
    <linearGradient id="accent-fade-08" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1D4ED8" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#1D4ED8" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#1D4ED8" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <g id="chrome-stripe">
    <rect x="0" y="0" width="12" height="720" fill="url(#accent-fade-08)" />
  </g>
  <g id="chrome-footer">
    <text x="1208" y="672" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" fill="#334155" text-anchor="end" opacity="0.7">08 / 10</text>
  </g>
  <g id="content-title-08">
    <text x="36" y="64" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="64" font-weight="700" fill="#0F172A">小组观点</text>
    <rect x="36" y="76" width="72" height="3.5" rx="1.75" fill="#1D4ED8" opacity="0.8"/>
  </g>
  <g id="content-body-08">
    <rect x="36" y="104" width="1208" height="76" rx="24" fill="url(#row-grad-08)" stroke="#1D4ED8" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-08)"/>
    <rect x="36" y="104" width="4" height="76" rx="2" fill="#1D4ED8" opacity="0.8"/>
    <circle cx="68" cy="142" r="22" fill="none" stroke="#1D4ED8" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="68" cy="142" r="15" fill="#1D4ED8" fill-opacity="0.12"/>
    <text x="68" y="147" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" font-weight="700" fill="#1D4ED8" text-anchor="middle">01</text>
    <circle cx="110" cy="144" r="4" fill="#1D4ED8" opacity="0.85"/>
    <text x="124" y="150" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#0F172A"><tspan x="124" dy="0">算法本身无善恶，目标函数的设计立场才是关键</tspan></text>
    <path d="M 1220 136 L 1226 142 L 1220 148" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <rect x="36" y="192" width="1208" height="76" rx="24" fill="url(#row-grad-08)" stroke="#0030BA" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-08)"/>
    <rect x="36" y="192" width="4" height="76" rx="2" fill="#0030BA" opacity="0.8"/>
    <circle cx="68" cy="230" r="22" fill="none" stroke="#0030BA" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="68" cy="230" r="15" fill="#0030BA" fill-opacity="0.12"/>
    <text x="68" y="235" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" font-weight="700" fill="#0030BA" text-anchor="middle">02</text>
    <circle cx="110" cy="232" r="4" fill="#0030BA" opacity="0.85"/>
    <text x="124" y="238" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#0F172A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#0030BA">创作者视角</tspan><tspan fill="#CBD5E1" opacity="0.6">：</tspan>与其&quot;猜算法&quot;，不如死磕完播率背后的内容质量</tspan></text>
    <path d="M 1220 224 L 1226 230 L 1220 236" fill="none" stroke="#0030BA" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <rect x="36" y="280" width="1208" height="76" rx="24" fill="url(#row-grad-08)" stroke="#4576FF" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-08)"/>
    <rect x="36" y="280" width="4" height="76" rx="2" fill="#4576FF" opacity="0.8"/>
    <circle cx="68" cy="318" r="22" fill="none" stroke="#4576FF" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="68" cy="318" r="15" fill="#4576FF" fill-opacity="0.12"/>
    <text x="68" y="323" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" font-weight="700" fill="#3B6CF6" text-anchor="middle">03</text>
    <circle cx="110" cy="320" r="4" fill="#4576FF" opacity="0.85"/>
    <text x="124" y="326" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#0F172A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#3B6CF6">用户视角</tspan><tspan fill="#CBD5E1" opacity="0.6">：</tspan>主动搜索与主动负反馈，是夺回信息主动权的低成本方式</tspan></text>
    <path d="M 1220 312 L 1226 318 L 1220 324" fill="none" stroke="#4576FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <rect x="36" y="368" width="1208" height="76" rx="24" fill="url(#row-grad-08)" stroke="#1D4ED8" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-08)"/>
    <rect x="36" y="368" width="4" height="76" rx="2" fill="#1D4ED8" opacity="0.8"/>
    <circle cx="68" cy="406" r="22" fill="none" stroke="#1D4ED8" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="68" cy="406" r="15" fill="#1D4ED8" fill-opacity="0.12"/>
    <text x="68" y="411" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" font-weight="700" fill="#1D4ED8" text-anchor="middle">04</text>
    <circle cx="110" cy="408" r="4" fill="#1D4ED8" opacity="0.85"/>
    <text x="124" y="414" font-family="Calibri, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#0F172A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#1D4ED8">监管视角</tspan><tspan fill="#CBD5E1" opacity="0.6">：</tspan>算法备案与&quot;可关闭个性化推荐&quot;已写入国内法规</tspan></text>
    <path d="M 1220 400 L 1226 406 L 1220 412" fill="none" stroke="#1D4ED8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  </g>
</svg>