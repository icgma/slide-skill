<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card-grad-09" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4F6FA"/>
      <stop offset="100%" stop-color="#F4F6FA" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="card-shadow-09" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.10" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb-09" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#254272" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#254272" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2-09" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#4D6A9A" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#4D6A9A" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="decor-09">
