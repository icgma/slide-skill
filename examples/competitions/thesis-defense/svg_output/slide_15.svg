    <path d="M 1220 338 L 1226 344 L 1220 350" fill="none" stroke="#5572A2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <rect x="36" y="420" width="1208" height="76" rx="24" fill="url(#row-grad-15)" stroke="#2D4A7A" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-15)"/>
