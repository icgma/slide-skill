    <path d="M 1220 224 L 1226 230 L 1220 236" fill="none" stroke="#0F2C5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <rect x="36" y="280" width="1208" height="128" rx="24" fill="url(#row-grad-15)" stroke="#5572A2" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-15)"/>
    <rect x="36" y="280" width="4" height="128" rx="2" fill="#5572A2" opacity="0.8"/>
    <circle cx="68" cy="344" r="22" fill="none" stroke="#5572A2" stroke-width="1.5" stroke-opacity="0.25"/>
