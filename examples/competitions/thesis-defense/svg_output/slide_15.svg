    <circle cx="68" cy="458" r="22" fill="none" stroke="#2D4A7A" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="68" cy="458" r="15" fill="#2D4A7A" fill-opacity="0.12"/>
    <text x="68" y="463" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="21" font-weight="700" fill="#2D4A7A" text-anchor="middle">04</text>
    <circle cx="110" cy="460" r="4" fill="#2D4A7A" opacity="0.85"/>
    <text x="124" y="466" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#1B2A4A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#2D4A7A">应用展望</tspan><tspan fill="#C9D2E3" opacity="0.6">:</tspan>与驿站管理系统对接,实现预测、排班、复盘闭环</tspan></text>
    <path d="M 1220 452 L 1226 458 L 1220 464" fill="none" stroke="#2D4A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
