    <text x="68" y="349" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="21" font-weight="700" fill="#4B6898" text-anchor="middle">03</text>
