<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card-grad-03" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4F6FA"/>
      <stop offset="100%" stop-color="#F4F6FA" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="card-shadow-03" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.10" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb-03" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#2D4A7A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2D4A7A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2-03" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#5572A2" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5572A2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="decor-03">
    <ellipse cx="1240" cy="30" rx="400" ry="280" fill="url(#orb-03)"/>
    <ellipse cx="60" cy="690" rx="280" ry="200" fill="url(#orb2-03)"/>
    <line x1="1280" y1="0" x2="1080" y2="180" stroke="#2D4A7A" stroke-width="2" opacity="0.12"/>
    <line x1="1280" y1="0" x2="1140" y2="120" stroke="#2D4A7A" stroke-width="1" opacity="0.08"/>
  </g>
  <g id="decor-bar-03">
    <rect x="1244" y="0" width="36" height="720" fill="#2D4A7A" opacity="0.04"/>
  </g>
  <defs>
    <linearGradient id="accent-fade-03" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#2D4A7A" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#2D4A7A" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#2D4A7A" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <g id="chrome-stripe">
    <rect x="0" y="0" width="12" height="720" fill="url(#accent-fade-03)" />
  </g>
  <g id="chrome-footer">
    <text x="1208" y="672" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="21" fill="#44506B" text-anchor="end" opacity="0.7">03 / 16</text>
  </g>
  <g id="content-title-03">
    <text x="36" y="64" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="64" font-weight="700" fill="#1B2A4A">研究背景</text>
    <rect x="36" y="76" width="72" height="3.5" rx="1.75" fill="#2D4A7A" opacity="0.8"/>
  </g>
  <g id="content-body-03">
    <rect x="36" y="144" width="1208" height="514" rx="24" fill="url(#card-grad-03)" stroke="#2D4A7A" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-03)"/>
    <rect x="36" y="144" width="4" height="514" rx="2" fill="#2D4A7A" opacity="0.8"/>
    <polygon points="90,182 94,178 98,182 94,186" fill="#2D4A7A" opacity="0.8"/>
    <text x="108" y="202" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#44506B"><tspan x="108" dy="0"><tspan font-weight="700" fill="#2D4A7A">校园快递驿站取件量波动剧烈</tspan><tspan fill="#C9D2E3" opacity="0.6">:</tspan>开学周、双 11、雨雪天气都会造成排</tspan><tspan x="108" dy="52">队高峰</tspan></text>
    <polygon points="90,306 94,302 98,306 94,310" fill="#2D4A7A" opacity="0.8"/>
    <text x="108" y="326" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#44506B"><tspan x="108" dy="0">驿站排班目前依赖站长经验,人力常年错配,学生高峰期平均排队</tspan><tspan x="108" dy="52">18 分钟</tspan></text>
    <polygon points="90,430 94,426 98,430 94,434" fill="#2D4A7A" opacity="0.8"/>
    <text x="108" y="450" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#44506B"><tspan x="108" dy="0">取件量提前一天可知,即可把兼职班次和货架空间提前调度到位</tspan></text>
    <polygon points="90,502 94,498 98,502 94,506" fill="#2D4A7A" opacity="0.8"/>
    <text x="108" y="522" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#44506B"><tspan x="108" dy="0">时间序列深度学习已在电力负荷、地铁客流预测中成熟落地,快递驿站场</tspan><tspan x="108" dy="52">景尚缺系统研究</tspan></text>
  </g>
</svg>