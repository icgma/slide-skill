<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card-grad-12" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F4F6FA"/>
      <stop offset="100%" stop-color="#F4F6FA" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="card-shadow-12" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.10" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb-12" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#375484" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#375484" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2-12" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#5F7CAC" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5F7CAC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="decor-12">
    <ellipse cx="1240" cy="30" rx="400" ry="280" fill="url(#orb-12)"/>
    <ellipse cx="60" cy="690" rx="280" ry="200" fill="url(#orb2-12)"/>
    <line x1="1280" y1="0" x2="1080" y2="180" stroke="#375484" stroke-width="2" opacity="0.12"/>
    <line x1="1280" y1="0" x2="1140" y2="120" stroke="#375484" stroke-width="1" opacity="0.08"/>
  </g>
  <g id="decor-bar-12">
    <rect x="1244" y="0" width="36" height="720" fill="#375484" opacity="0.04"/>
  </g>
  <defs>
    <linearGradient id="accent-fade-12" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#375484" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#375484" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#375484" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <g id="chrome-stripe">
    <rect x="0" y="0" width="12" height="720" fill="url(#accent-fade-12)" />
  </g>
  <g id="chrome-footer">
    <text x="1208" y="672" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="21" fill="#44506B" text-anchor="end" opacity="0.7">12 / 16</text>
  </g>
  <g id="content-title-12">
    <text x="36" y="64" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="64" font-weight="700" fill="#1B2A4A">预测误差分析</text>
    <rect x="36" y="76" width="72" height="3.5" rx="1.75" fill="#375484" opacity="0.8"/>
  </g>
  <g id="content-body-12">
    <rect x="36" y="144" width="1208" height="358" rx="24" fill="url(#card-grad-12)" stroke="#375484" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-12)"/>
    <rect x="36" y="144" width="4" height="358" rx="2" fill="#375484" opacity="0.8"/>
    <polygon points="90,182 94,178 98,182 94,186" fill="#375484" opacity="0.8"/>
    <text x="108" y="202" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#44506B"><tspan x="108" dy="0"><tspan font-weight="700" fill="#375484">误差集中</tspan><tspan fill="#C9D2E3" opacity="0.6">:</tspan>全年误差最大的 5 天全部落在双 11、618 与开学周</tspan></text>
    <polygon points="90,254 94,250 98,254 94,258" fill="#375484" opacity="0.8"/>
    <text x="108" y="274" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#44506B"><tspan x="108" dy="0"><tspan font-weight="700" fill="#375484">天气影响</tspan><tspan fill="#C9D2E3" opacity="0.6">:</tspan>雨雪天取件量下降但次日回补,模型对回补幅度略有低估</tspan></text>
    <polygon points="90,326 94,322 98,326 94,330" fill="#375484" opacity="0.8"/>
    <text x="108" y="346" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#44506B"><tspan x="108" dy="0"><tspan font-weight="700" fill="#375484">站点差异</tspan><tspan fill="#C9D2E3" opacity="0.6">:</tspan>宿舍区驿站规律性强误差小,教学区驿站受课表扰动误差偏大</tspan></text>
    <polygon points="90,398 94,394 98,398 94,402" fill="#375484" opacity="0.8"/>
    <text x="108" y="418" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#44506B"><tspan x="108" dy="0"><tspan font-weight="700" fill="#375484">改进方向</tspan><tspan fill="#C9D2E3" opacity="0.6">:</tspan>引入快递入库量作为先行指标,可进一步压缩峰值日误差</tspan></text>
  </g>
</svg>