    <text x="124" y="414" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#1B2A4A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#2D4A7A">两层 LSTM</tspan><tspan fill="#C9D2E3" opacity="0.6">:</tspan>R² 0.91,在全部三个驿站上均为最优</tspan></text>
