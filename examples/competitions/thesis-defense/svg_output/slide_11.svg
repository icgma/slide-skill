    <text x="124" y="150" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#1B2A4A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#2D4A7A">移动平均</tspan><tspan fill="#C9D2E3" opacity="0.6">:</tspan>R² 0.76,完全无法响应促销与节假日波动</tspan></text>
    <path d="M 1220 136 L 1226 142 L 1220 148" fill="none" stroke="#2D4A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
