<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="row-grad-11" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F4F6FA"/>
      <stop offset="100%" stop-color="#F4F6FA" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="card-shadow-11" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.10" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb-11" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#2D4A7A" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#2D4A7A" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2-11" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#5572A2" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5572A2" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="decor-11">
    <ellipse cx="1240" cy="30" rx="400" ry="280" fill="url(#orb-11)"/>
    <ellipse cx="60" cy="690" rx="280" ry="200" fill="url(#orb2-11)"/>
