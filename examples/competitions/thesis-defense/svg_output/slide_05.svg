    <text x="68" y="313" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="21" font-weight="700" fill="#0F2C5C" text-anchor="middle">02</text>
