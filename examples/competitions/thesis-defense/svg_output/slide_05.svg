    <text x="68" y="453" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="21" font-weight="700" fill="#4B6898" text-anchor="middle">03</text>
    <circle cx="110" cy="424" r="4" fill="#5572A2" opacity="0.85"/>
    <text x="124" y="430" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#1B2A4A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#4B6898">深度学习</tspan><tspan fill="#C9D2E3" opacity="0.6">:</tspan>LSTM、GRU 在客流与负荷预测中表现稳定,逐步成为主</tspan><tspan x="124" dy="52">流基线</tspan></text>
    <path d="M 1220 442 L 1226 448 L 1220 454" fill="none" stroke="#5572A2" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
