    <text x="124" y="290" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#1B2A4A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#0F2C5C">机器学习</tspan><tspan fill="#C9D2E3" opacity="0.6">:</tspan>随机森林、XGBoost 引入外部特征后精度提升,但对时序</tspan><tspan x="124" dy="52">依赖建模有限</tspan></text>
    <path d="M 1220 302 L 1226 308 L 1220 314" fill="none" stroke="#0F2C5C" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <rect x="36" y="384" width="1208" height="128" rx="24" fill="url(#row-grad-05)" stroke="#5572A2" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-05)"/>
