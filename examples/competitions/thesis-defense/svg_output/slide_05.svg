    <circle cx="68" cy="588" r="22" fill="none" stroke="#2D4A7A" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="68" cy="588" r="15" fill="#2D4A7A" fill-opacity="0.12"/>
    <text x="68" y="593" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="21" font-weight="700" fill="#2D4A7A" text-anchor="middle">04</text>
    <circle cx="110" cy="564" r="4" fill="#2D4A7A" opacity="0.85"/>
    <text x="124" y="570" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#1B2A4A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#2D4A7A">研究缺口</tspan><tspan fill="#C9D2E3" opacity="0.6">:</tspan>面向校园驿站的公开研究少,缺少节假日与促销事件的联</tspan><tspan x="124" dy="52">合建模</tspan></text>
    <path d="M 1220 582 L 1226 588 L 1220 594" fill="none" stroke="#2D4A7A" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
