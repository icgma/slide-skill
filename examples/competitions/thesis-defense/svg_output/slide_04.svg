    <radialGradient id="orb2-04" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#5F7CAC" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#5F7CAC" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="decor-04">
