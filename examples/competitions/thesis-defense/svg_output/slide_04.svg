    <circle cx="110" cy="144" r="4" fill="#375484" opacity="0.85"/>
    <text x="124" y="150" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#1B2A4A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#375484">理论意义</tspan><tspan fill="#C9D2E3" opacity="0.6">:</tspan>验证 LSTM 在中小规模、强周期、多突发事件序列上的适</tspan><tspan x="124" dy="52">用边界</tspan></text>
    <path d="M 1220 162 L 1226 168 L 1220 174" fill="none" stroke="#375484" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
