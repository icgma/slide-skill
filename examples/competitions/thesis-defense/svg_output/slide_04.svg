    <circle cx="68" cy="510" r="15" fill="#375484" fill-opacity="0.12"/>
    <text x="68" y="515" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="21" font-weight="700" fill="#375484" text-anchor="middle">04</text>
    <circle cx="110" cy="512" r="4" fill="#375484" opacity="0.85"/>
    <text x="124" y="518" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#1B2A4A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#375484">推广价值</tspan><tspan fill="#C9D2E3" opacity="0.6">:</tspan>方法可迁移到食堂客流、图书馆座位等校园资源调度场景</tspan></text>
