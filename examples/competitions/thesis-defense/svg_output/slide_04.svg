    <text x="124" y="430" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#1B2A4A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#4B6898">数据价值</tspan><tspan fill="#C9D2E3" opacity="0.6">:</tspan>沉淀一套可复用的校园驿站数据清洗与特征构建流程</tspan></text>
    <path d="M 1220 416 L 1226 422 L 1220 428" fill="none" stroke="#5F7CAC" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
