    <text x="124" y="290" font-family="'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', Arial, sans-serif" font-size="36" fill="#1B2A4A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#193666">实践意义</tspan><tspan fill="#C9D2E3" opacity="0.6">:</tspan>为驿站提供可执行的次日取件量预测,直接支撑排班与货</tspan><tspan x="124" dy="52">架规划</tspan></text>
    <path d="M 1220 302 L 1226 308 L 1220 314" fill="none" stroke="#193666" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <rect x="36" y="384" width="1208" height="76" rx="24" fill="url(#row-grad-04)" stroke="#5F7CAC" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-04)"/>
