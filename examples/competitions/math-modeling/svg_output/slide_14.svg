  </g>
  <g id="content-body-14">
    <text x="640" y="380" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="22" fill="#475569" text-anchor="middle" data-fit-box="192,358,896,132" data-line-height="1.25"><tspan x="640" dy="0">构建&quot;GBRT 需求预测 + 整数规划调度 + 遗传算法求解&quot;完整建模链条</tspan><tspan x="640" dy="27">高峰缺车率由 18.6% 降至 7.9%，调度成本下降 21.0%</tspan><tspan x="640" dy="27">灵敏度分析验证方案在需求波动下依然稳健</tspan><tspan x="640" dy="27">感谢评委老师，敬请批评指正！</tspan></text>
