      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8"/>
    </linearGradient>
    <clipPath id="proc-card-clip-03-2">
      <rect x="36" y="417" width="580" height="165" rx="24"/>
