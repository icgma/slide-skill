    <circle cx="954" cy="457" r="20" fill="none" stroke="#007ABD" stroke-opacity="0.25" stroke-width="1.2"/>
    <circle cx="954" cy="457" r="14" fill="#007ABD"/>
    <text x="954" y="462" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="26" font-weight="700" fill="#F1F5F9" text-anchor="middle">04</text>
    <text x="954" y="521" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="32" fill="#0F172A" text-anchor="middle"><tspan x="954" dy="0">预测期内天气、节假日等外部条件与</tspan><tspan x="954" dy="37">历史同期分布一致</tspan></text>
