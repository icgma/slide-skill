    <!-- Inner border detail -->
    <rect x="41" y="422" width="570" height="155" rx="20" fill="none" stroke="#3EC0FF" stroke-opacity="0.08" stroke-width="1"/>
    <circle cx="326" cy="457" r="20" fill="none" stroke="#3EC0FF" stroke-opacity="0.25" stroke-width="1.2"/>
    <circle cx="326" cy="457" r="14" fill="#3EC0FF"/>
    <text x="326" y="462" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="26" font-weight="700" fill="#0F172A" text-anchor="middle">03</text>
    <text x="326" y="521" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="32" fill="#0F172A" text-anchor="middle"><tspan x="326" dy="0">调度车单程装载不超过额定容量</tspan><tspan x="326" dy="37">20 辆，装卸时间计入固定成本</tspan></text>
    <g clip-path="url(#proc-card-clip-03-3)">
