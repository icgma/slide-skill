    <rect x="640" y="378" width="563" height="96" rx="24" fill="#FFFFFF" fill-opacity="1" stroke="#1496D9" stroke-opacity="0.24" stroke-width="1.5" filter="url(#card-shadow-02)"/>
    <text x="660" y="412" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="16" font-weight="800" fill="#20A2E5">! 03</text>
    <text x="660" y="450" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="20" font-weight="700" fill="#0F172A" data-fit-box="660,426,521,38" data-line-height="1.18"><tspan x="660" dy="0">问题二：在车队与容量约束下制定总成本最小的调度方案</tspan></text>
    <rect x="640" y="492" width="563" height="96" rx="24" fill="#FFFFFF" fill-opacity="1" stroke="#26A8EB" stroke-opacity="0.24" stroke-width="1.5" filter="url(#card-shadow-02)"/>
    <text x="660" y="526" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="16" font-weight="800" fill="#20A2E5">! 04</text>
