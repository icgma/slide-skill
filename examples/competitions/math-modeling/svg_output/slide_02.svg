    <rect x="640" y="264" width="563" height="96" rx="24" fill="#FFFFFF" fill-opacity="1" stroke="#0284C7" stroke-opacity="0.24" stroke-width="1.5" filter="url(#card-shadow-02)"/>
    <text x="660" y="298" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="16" font-weight="800" fill="#20A2E5">! 02</text>
