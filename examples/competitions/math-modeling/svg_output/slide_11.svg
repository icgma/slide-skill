<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="card-grad-11" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.85"/>
    </linearGradient>
    <filter id="card-shadow-11" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.10" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb-11" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#007CBF" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#007CBF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2-11" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#28A4E7" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#28A4E7" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="#F1F5F9"/></g>
  <g id="decor-11">
    <ellipse cx="1240" cy="30" rx="400" ry="280" fill="url(#orb-11)"/>
    <ellipse cx="60" cy="690" rx="280" ry="200" fill="url(#orb2-11)"/>
    <line x1="1280" y1="0" x2="1080" y2="180" stroke="#007CBF" stroke-width="2" opacity="0.12"/>
    <line x1="1280" y1="0" x2="1140" y2="120" stroke="#007CBF" stroke-width="1" opacity="0.08"/>
  </g>
  <g id="decor-bar-11">
    <rect x="1244" y="0" width="36" height="720" fill="#007CBF" opacity="0.04"/>
  </g>
  <defs>
    <linearGradient id="accent-fade-11" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#007CBF" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#007CBF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#007CBF" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <g id="chrome-stripe">
    <rect x="0" y="0" width="12" height="720" fill="url(#accent-fade-11)" />
  </g>
  <g id="chrome-footer">
    <text x="1208" y="672" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" fill="#475569" text-anchor="end" opacity="0.7">11 / 14</text>
  </g>
  <g id="content-title-11">
    <text x="36" y="64" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="64" font-weight="700" fill="#0F172A">结果分析：服务水平对比</text>
    <rect x="36" y="76" width="72" height="3.5" rx="1.75" fill="#007CBF" opacity="0.8"/>
  </g>
  <g id="content-body-11">
    <rect x="36" y="144" width="1208" height="358" rx="24" fill="url(#card-grad-11)" stroke="#007CBF" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-11)"/>
    <rect x="36" y="144" width="4" height="358" rx="2" fill="#007CBF" opacity="0.8"/>
    <polygon points="90,182 94,178 98,182 94,186" fill="#007CBF" opacity="0.8"/>
    <text x="108" y="202" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#475569"><tspan x="108" dy="0">指标|调度前|优化后|变化</tspan></text>
    <polygon points="90,254 94,250 98,254 94,258" fill="#007CBF" opacity="0.8"/>
    <text x="108" y="274" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#475569"><tspan x="108" dy="0">高峰缺车率|18.6%|7.9%|下降 10.7 个百分点</tspan></text>
    <polygon points="90,326 94,322 98,326 94,330" fill="#007CBF" opacity="0.8"/>
    <text x="108" y="346" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#475569"><tspan x="108" dy="0">日均调度成本|1.24 万元|0.98 万元|下降 21.0%</tspan></text>
    <polygon points="90,398 94,394 98,398 94,402" fill="#007CBF" opacity="0.8"/>
    <text x="108" y="418" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#475569"><tspan x="108" dy="0">日均借车失败次数|9,860 次|4,190 次|下降 57.5%</tspan></text>
  </g>
</svg>