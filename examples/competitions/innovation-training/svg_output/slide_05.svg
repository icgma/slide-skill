    <text x="639" y="427" font-family="Poppins, Inter, Calibri, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="23" fill="#1E1B4B" text-anchor="middle"><tspan x="639" dy="0">安全机制创新：三级风险分层（</tspan><tspan x="639" dy="27">日常倾诉 / 持续低落 / 危机</tspan><tspan x="639" dy="27">信号），高风险自动转介人工</tspan></text>
    <line x1="836" y1="407" x2="860" y2="407" stroke="#4548D3" stroke-width="2.5" opacity="0.6"/>
