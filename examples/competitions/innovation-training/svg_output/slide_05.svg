    <text x="1057" y="431" font-family="Poppins, Inter, Calibri, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="27" fill="#1E1B4B" text-anchor="middle"><tspan x="1057" dy="0">隐私架构创新：对话端侧</tspan><tspan x="1057" dy="31">脱敏加校内私有化部署，</tspan><tspan x="1057" dy="31">数据不出校</tspan></text>
