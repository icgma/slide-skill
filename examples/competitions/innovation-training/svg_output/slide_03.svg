    <radialGradient id="orb2-03" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#9598FF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#9598FF" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="#F5F3FF"/></g>
  <g id="decor-03">
