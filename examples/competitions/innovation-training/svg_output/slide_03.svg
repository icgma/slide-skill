    <text x="124" y="290" font-family="Poppins, Inter, Calibri, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="36" fill="#1E1B4B"><tspan x="124" dy="0"><tspan font-weight="700" fill="#4F52DD">理论意义</tspan><tspan fill="#E0E7FF" opacity="0.6">：</tspan>探索大语言模型共情对话在校园细分场景中的边界与规范</tspan></text>
    <path d="M 1220 276 L 1226 282 L 1220 288" fill="none" stroke="#4F52DD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <rect x="36" y="332" width="1208" height="76" rx="24" fill="url(#row-grad-03)" stroke="#9598FF" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-03)"/>
    <rect x="36" y="332" width="4" height="76" rx="2" fill="#9598FF" opacity="0.8"/>
    <circle cx="68" cy="370" r="22" fill="none" stroke="#9598FF" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="68" cy="370" r="15" fill="#9598FF" fill-opacity="0.12"/>
    <text x="68" y="375" font-family="Poppins, Inter, Calibri, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="21" font-weight="700" fill="#8184FF" text-anchor="middle">03</text>
