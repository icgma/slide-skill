    <circle cx="68" cy="458" r="15" fill="#6D70FB" fill-opacity="0.12"/>
    <text x="68" y="463" font-family="Poppins, Inter, Calibri, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="21" font-weight="700" fill="#8184FF" text-anchor="middle">04</text>
    <circle cx="110" cy="460" r="4" fill="#6D70FB" opacity="0.85"/>
    <text x="124" y="466" font-family="Poppins, Inter, Calibri, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="36" fill="#1E1B4B"><tspan x="124" dy="0"><tspan font-weight="700" fill="#8184FF">社会价值</tspan><tspan fill="#E0E7FF" opacity="0.6">：</tspan>形成可复制、可移交的校园心理数字化服务范式</tspan></text>
    <path d="M 1220 452 L 1226 458 L 1220 464" fill="none" stroke="#6D70FB" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
