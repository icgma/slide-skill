    <text x="124" y="378" font-family="Poppins, Inter, Calibri, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="36" fill="#1E1B4B"><tspan x="124" dy="0"><tspan font-weight="700" fill="#8184FF">教育意义</tspan><tspan fill="#E0E7FF" opacity="0.6">：</tspan>项目本身即是心理学与计算机专业学生的跨学科实践</tspan></text>
    <path d="M 1220 364 L 1226 370 L 1220 376" fill="none" stroke="#9598FF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <rect x="36" y="420" width="1208" height="76" rx="24" fill="url(#row-grad-03)" stroke="#6D70FB" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-03)"/>
