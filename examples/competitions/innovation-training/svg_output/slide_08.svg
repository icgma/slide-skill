    <text x="108" y="202" font-family="Poppins, Inter, Calibri, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="36" fill="#4A4485"><tspan x="108" dy="0"><tspan font-weight="700" fill="#6366F1">知情同意</tspan><tspan fill="#E0E7FF" opacity="0.6">：</tspan>首次使用明确告知 AI 身份、能力边界与数据用途</tspan></text>
