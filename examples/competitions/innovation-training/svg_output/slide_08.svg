    <text x="108" y="418" font-family="Poppins, Inter, Calibri, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="36" fill="#4A4485"><tspan x="108" dy="0"><tspan font-weight="700" fill="#6366F1">伦理审查</tspan><tspan fill="#E0E7FF" opacity="0.6">：</tspan>试点方案已按学校科研伦理流程提交审查</tspan></text>
