<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="card-shadow-01" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.10" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="#F5F3FF"/></g>
  <g id="academic-grid-01">
    <line x1="48" y1="0" x2="48" y2="720" stroke="#6D70FB" stroke-width="1" opacity="0.2"/>
    <line x1="0" y1="158" x2="1280" y2="158" stroke="#E0E7FF" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="640" x2="1280" y2="640" stroke="#E0E7FF" stroke-width="1" opacity="0.4"/>
    <rect x="48" y="158" width="1184" height="3" fill="#6D70FB"/>
  </g>
  <g id="content-eyebrow-01">
    <text x="48" y="115" font-family="Poppins, Inter, Calibri, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="26" fill="#6D70FB" font-weight="700" letter-spacing="3">RESEARCH REPORT</text>
  </g>
  <g id="content-title-01">
    <text x="48" y="251" font-family="Poppins, Inter, Calibri, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="68" font-weight="700" fill="#1E1B4B"><tspan x="48" dy="0">「心屿」：大学生心理健康 AI 陪</tspan><tspan x="48" dy="88">伴助手</tspan></text>
  </g>
  <g id="content-body-01">
    <text x="48" y="359" font-family="Poppins, Inter, Calibri, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="36" fill="#4A4485" opacity="0.85"><tspan x="48" dy="0">国家级大学生创新创业训练计划项目申报 | 创新训练类 | 项目周期</tspan><tspan x="48" dy="45">12 个月</tspan></text>
  </g>
  <g id="content-footer-01">
    <text x="48" y="680" font-family="Poppins, Inter, Calibri, 'PingFang SC', 'Noto Sans SC', sans-serif" font-size="26" fill="#4A4485">PAGES: 13 / ACADEMIC OVERVIEW</text>
  </g>
</svg>