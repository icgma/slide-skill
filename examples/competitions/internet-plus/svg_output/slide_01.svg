<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="card-shadow-01" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.10" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="#FFFFFF"/></g>
  <g id="academic-grid-01">
    <line x1="48" y1="0" x2="48" y2="720" stroke="#8644F7" stroke-width="1" opacity="0.2"/>
    <line x1="0" y1="158" x2="1280" y2="158" stroke="#E5E7EB" stroke-width="1" opacity="0.4"/>
    <line x1="0" y1="640" x2="1280" y2="640" stroke="#E5E7EB" stroke-width="1" opacity="0.4"/>
    <rect x="48" y="158" width="1184" height="3" fill="#8644F7"/>
  </g>
  <g id="content-eyebrow-01">
    <text x="48" y="115" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="26" fill="#8644F7" font-weight="700" letter-spacing="3">RESEARCH REPORT</text>
  </g>
  <g id="content-title-01">
    <text x="48" y="251" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="68" font-weight="700" fill="#111827"><tspan x="48" dy="0">绿循环——智能垃圾分类回收平台</tspan></text>
  </g>
  <g id="content-body-01">
    <text x="48" y="271" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#6B7280" opacity="0.85"><tspan x="48" dy="0">让每一次分类都有回报 | 中国国际「互联网+」大学生创新创业大赛 · 校</tspan><tspan x="48" dy="45">赛路演 | 绿循环团队</tspan></text>
  </g>
  <g id="content-footer-01">
    <text x="48" y="680" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="26" fill="#6B7280">PAGES: 17 / ACADEMIC OVERVIEW</text>
  </g>
</svg>