    <circle cx="92%" cy="50%" r="160" stroke="#8644F7" stroke-width="1.2" stroke-dasharray="6,6" fill="none" opacity="0.15"/>
    <path d="M137 506 H1144" stroke="#8644F7" stroke-opacity="0.24" stroke-width="1.5"/>
  </g>
  <defs>
    <linearGradient id="accent-fade-17" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#8644F7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#8644F7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#8644F7" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <g id="chrome-stripe">
    <rect x="0" y="0" width="12" height="720" fill="url(#accent-fade-17)" />
  </g>
  <g id="chrome-footer">
    <text x="1208" y="672" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" fill="#6B7280" text-anchor="end" opacity="0.7">17 / 17</text>
  </g>
  <g id="content-closing-17" data-theme-profile="default" data-scene-variant="center-card">
  <g id="content-card-17" filter="url(#card-shadow-17)">
    <rect x="103" y="180" width="1075" height="360" rx="24" fill="url(#close-card-grad-17)" stroke="url(#close-border-17)" stroke-width="2"/>
    <rect x="111" y="188" width="1059" height="344" rx="20" fill="none" stroke="#8644F7" stroke-opacity="0.18" stroke-width="1.2"/>
  </g>
  <g id="content-eyebrow-17">
    <rect x="580" y="212" width="120" height="24" rx="12" fill="#8644F7" fill-opacity="0.10" stroke="#8644F7" stroke-opacity="0.25" stroke-width="1"/>
    <text x="640" y="228" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="19" font-weight="700" fill="#8644F7" letter-spacing="3" text-anchor="middle">THANK YOU</text>
  </g>
  <g id="content-title-17">
    <text x="640" y="325" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="62" font-weight="700" fill="#111827" text-anchor="middle" data-fit-box="151,250,979,88" data-line-height="1.12"><tspan x="640" dy="0">愿景：让分类成为习惯</tspan></text>
  </g>
  <g id="content-body-17">
    <text x="640" y="380" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="22" fill="#6B7280" text-anchor="middle" data-fit-box="192,358,896,132" data-line-height="1.25"><tspan x="640" dy="0">绿循环要做的不是一台回收柜，而是社区绿色生活的入口。</tspan><tspan x="640" dy="27">三年服务 100 万家庭，让每一次分类都有回报，让城市资源真正循环起来。</tspan><tspan x="640" dy="27">谢谢各位评委，期待与您共建绿循环。</tspan></text>
  </g>
  </g>
</svg>
