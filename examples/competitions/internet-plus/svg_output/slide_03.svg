    <rect x="640" y="378" width="563" height="96" rx="24" fill="#FAFAFA" fill-opacity="1" stroke="#9856FF" stroke-opacity="0.24" stroke-width="1.5" filter="url(#card-shadow-03)"/>
    <text x="660" y="412" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="16" font-weight="800" fill="#9A58FF">! 03</text>
    <text x="660" y="450" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="18" font-weight="700" fill="#111827" data-fit-box="660,426,521,38" data-line-height="1.18"><tspan x="660" dy="0">政府：末端处置设施投资到位，前端分出量与纯净度长期不达标</tspan></text>
    <rect x="640" y="492" width="563" height="96" rx="24" fill="#FAFAFA" fill-opacity="1" stroke="#AA68FF" stroke-opacity="0.24" stroke-width="1.5" filter="url(#card-shadow-03)"/>
    <text x="660" y="526" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="16" font-weight="800" fill="#9A58FF">! 04</text>
