      <stop offset="50%" stop-color="#7C3AED" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#7C3AED" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <g id="chrome-stripe">
    <rect x="0" y="0" width="12" height="720" fill="url(#accent-fade-02)" />
  </g>
  <g id="chrome-footer">
    <text x="1208" y="672" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" fill="#6B7280" text-anchor="end" opacity="0.7">02 / 17</text>
  </g>
  <g id="content-title-02">
    <text x="36" y="64" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="54" font-weight="700" fill="#111827">痛点：分类落地难在&quot;最后一百米&quot;</text>
    <rect x="36" y="76" width="72" height="3.5" rx="1.75" fill="#7C3AED" opacity="0.8"/>
  </g>
