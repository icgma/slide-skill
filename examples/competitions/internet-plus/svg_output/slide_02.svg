    <rect x="36" y="150" width="512" height="340" rx="24" fill="#FAFAFA" stroke="#7C3AED" stroke-opacity="0.2" stroke-width="1.5" filter="url(#card-shadow-02)"/>
    <text x="70" y="232" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="14" font-weight="700" fill="#7C3AED" letter-spacing="4">FRICTION</text>
    <text x="70" y="322" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="52" font-weight="800" fill="#111827">痛点：分类落地难在&quot;最后一百米&quot;</text>
    <text x="70" y="446" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="18" fill="#6B7280" opacity="0.8">4 mapped signals</text>
    <rect x="640" y="150" width="563" height="96" rx="24" fill="#FAFAFA" fill-opacity="1" stroke="#6A28DB" stroke-opacity="0.24" stroke-width="1.5" filter="url(#card-shadow-02)"/>
    <text x="660" y="184" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="16" font-weight="800" fill="#6A28DB">! 01</text>
    <text x="660" y="222" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="20" font-weight="700" fill="#111827" data-fit-box="660,198,521,38" data-line-height="1.18"><tspan x="660" dy="0">297 个地级市推行强制分类，社区端仍依赖人工督导</tspan></text>
    <rect x="640" y="264" width="563" height="96" rx="24" fill="#FAFAFA" fill-opacity="1" stroke="#7C3AED" stroke-opacity="0.24" stroke-width="1.5" filter="url(#card-shadow-02)"/>
    <text x="660" y="298" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="16" font-weight="800" fill="#7C3AED">! 02</text>
    <text x="660" y="336" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="19" font-weight="700" fill="#111827" data-fit-box="660,312,521,38" data-line-height="1.18"><tspan x="660" dy="0">撤桶并点后高峰投放排队、误投率高，居民参与热情快速回落</tspan></text>
    <rect x="640" y="378" width="563" height="96" rx="24" fill="#FAFAFA" fill-opacity="1" stroke="#8E4CFF" stroke-opacity="0.24" stroke-width="1.5" filter="url(#card-shadow-02)"/>
    <text x="660" y="412" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="16" font-weight="800" fill="#9A58FF">! 03</text>
    <text x="660" y="450" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="20" font-weight="700" fill="#111827" data-fit-box="660,426,521,38" data-line-height="1.18"><tspan x="660" dy="0">某区抽样：厨余分出纯净度仅 62%，远低于 90% 的要求</tspan></text>
    <rect x="640" y="492" width="563" height="96" rx="24" fill="#FAFAFA" fill-opacity="1" stroke="#A05EFF" stroke-opacity="0.24" stroke-width="1.5" filter="url(#card-shadow-02)"/>
    <text x="660" y="526" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="16" font-weight="800" fill="#9A58FF">! 04</text>
    <text x="660" y="564" font-family="Inter, 'Helvetica Neue', 'PingFang SC', 'Microsoft YaHei', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="20" font-weight="700" fill="#111827" data-fit-box="660,540,521,38" data-line-height="1.18"><tspan x="660" dy="0">人工督导成本高企：单小区每月督导支出约 9,000 元</tspan></text>
  </g>
</svg>