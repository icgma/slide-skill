<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter id="card-shadow-14" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="6" result="blur"/>
      <feOffset in="blur" dx="0" dy="3" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.16" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb-14" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2-14" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#2AACEF" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#2AACEF" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="case-left-grad-14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#F5F5F5" stop-opacity="1.0"/>
    </linearGradient>
    <clipPath id="case-left-clip-14">
      <rect x="90" y="160" width="530" height="490" rx="16" />
    </clipPath>
    <linearGradient id="case-right-grad-14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="1.0"/>
      <stop offset="100%" stop-color="#F5F5F5" stop-opacity="1.0"/>
    </linearGradient>
    <clipPath id="case-right-clip-14">
      <rect x="660" y="160" width="530" height="490" rx="16" />
    </clipPath>
  </defs>
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="#F1F5F9"/></g>
  <g id="decor-14">
    <ellipse cx="1240" cy="30" rx="400" ry="280" fill="url(#orb-14)"/>
    <ellipse cx="60" cy="690" rx="280" ry="200" fill="url(#orb2-14)"/>
    <line x1="1280" y1="0" x2="1080" y2="180" stroke="#0284C7" stroke-width="2" opacity="0.12"/>
    <line x1="1280" y1="0" x2="1140" y2="120" stroke="#0284C7" stroke-width="1" opacity="0.08"/>
  </g>
  <defs>
    <linearGradient id="accent-fade-14" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284C7" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0284C7" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <g id="chrome-stripe">
    <rect x="0" y="0" width="12" height="720" fill="url(#accent-fade-14)" />
  </g>
  <g id="chrome-footer">
    <text x="1208" y="672" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" fill="#475569" text-anchor="end" opacity="0.7">14 / 16</text>
  </g>
  <g id="content-title-14">
    <text x="36" y="54" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="46" font-weight="700" fill="#0F172A">典型案例：2025-08-04 特大暴雨复盘</text>
    <rect x="36" y="66" width="100" height="4" rx="2" fill="#0284C7"/>
  </g>
  <g id="content-casestudy-14">
    <g clip-path="url(#case-left-clip-14)">
      <rect x="90" y="160" width="530" height="490" fill="url(#case-left-grad-14)"/>
      <rect x="90" y="160" width="530" height="6" fill="#0284C7" opacity="0.85"/>
    </g>
    <rect x="90" y="160" width="530" height="490" rx="16" fill="none" stroke="#0284C7" stroke-opacity="0.35" stroke-width="1.5" filter="url(#card-shadow-14)"/>
    <rect x="114" y="184" width="70" height="20" rx="10" fill="#0284C7" fill-opacity="0.15"/>
    <text x="149" y="198" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="15" font-weight="700" fill="#0284C7" text-anchor="middle" letter-spacing="1">CASE</text>
    <text x="114" y="235" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="16" font-weight="600" fill="#0F172A"><tspan x="114" dy="0">过程雨量 128 毫米，最大小时雨强 68 毫米</tspan></text>
    <text x="114" y="266" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="16" font-weight="600" fill="#0F172A"><tspan x="114" dy="0">模型提前 2 小时发布预警</tspan></text>
    <text x="114" y="289" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="13" fill="#475569" opacity="0.8"><tspan x="114" dy="0">极高风险网格 41 个</tspan></text>
    <line x1="640" y1="180" x2="640" y2="630" stroke="#0284C7" stroke-opacity="0.25" stroke-width="1.5" stroke-dasharray="4 4"/>
    <circle cx="640" cy="405" r="10" fill="#0284C7" fill-opacity="0.08" stroke="#0284C7" stroke-opacity="0.2" stroke-width="1"/>
    <circle cx="640" cy="405" r="6" fill="#0284C7" fill-opacity="0.16"/>
    <circle cx="640" cy="405" r="3" fill="#0284C7"/>
    <g clip-path="url(#case-right-clip-14)">
      <rect x="660" y="160" width="530" height="490" fill="url(#case-right-grad-14)"/>
      <rect x="660" y="160" width="530" height="6" fill="#2AACEF" opacity="0.85"/>
    </g>
    <rect x="660" y="160" width="530" height="490" rx="16" fill="none" stroke="#2AACEF" stroke-opacity="0.35" stroke-width="1.5" filter="url(#card-shadow-14)"/>
    <rect x="684" y="184" width="100" height="20" rx="10" fill="#0284C7" fill-opacity="0.15"/>
    <text x="734" y="198" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="15" font-weight="700" fill="#0284C7" text-anchor="middle" letter-spacing="1">ANALYSIS</text>
    <text x="684" y="235" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="16" font-weight="600" fill="#0F172A"><tspan x="684" dy="0">实际 35 处积水点落于预警网格内，命中率 85.4%</tspan></text>
    <text x="684" y="266" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="16" font-weight="600" fill="#0F172A"><tspan x="684" dy="0">防汛部门据此预置排涝泵车 12 台，重点路段封控提前 40 分钟</tspan></text>
  </g>
</svg>