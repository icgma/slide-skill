<svg width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="row-grad-04" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.8"/>
    </linearGradient>
    <filter id="card-shadow-04" x="-20%" y="-20%" width="140%" height="150%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8" result="blur"/>
      <feOffset in="blur" dx="0" dy="4" result="offsetBlur"/>
      <feFlood flood-color="#000000" flood-opacity="0.10" result="shadowColor"/>
      <feComposite in="shadowColor" in2="offsetBlur" operator="in" result="shadow"/>
      <feMerge><feMergeNode in="shadow"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <radialGradient id="orb-04" cx="85%" cy="15%" r="55%">
      <stop offset="0%" stop-color="#0C8ED1" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0C8ED1" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="orb2-04" cx="15%" cy="85%" r="45%">
      <stop offset="0%" stop-color="#34B6F9" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#34B6F9" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="background"><rect x="0" y="0" width="1280" height="720" fill="#F1F5F9"/></g>
  <g id="decor-04">
    <ellipse cx="1240" cy="30" rx="400" ry="280" fill="url(#orb-04)"/>
    <ellipse cx="60" cy="690" rx="280" ry="200" fill="url(#orb2-04)"/>
    <line x1="1280" y1="0" x2="1080" y2="180" stroke="#0C8ED1" stroke-width="2" opacity="0.12"/>
    <line x1="1280" y1="0" x2="1140" y2="120" stroke="#0C8ED1" stroke-width="1" opacity="0.08"/>
  </g>
  <g id="decor-bar-04">
    <rect x="1232" y="0" width="48" height="720" fill="#0C8ED1" opacity="0.04"/>
  </g>
  <defs>
    <linearGradient id="accent-fade-04" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0C8ED1" stop-opacity="0.4"/>
      <stop offset="50%" stop-color="#0C8ED1" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0C8ED1" stop-opacity="0.4"/>
    </linearGradient>
  </defs>
  <g id="chrome-stripe">
    <rect x="0" y="0" width="12" height="720" fill="url(#accent-fade-04)" />
  </g>
  <g id="chrome-footer">
    <text x="1208" y="672" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" fill="#475569" text-anchor="end" opacity="0.7">04 / 16</text>
  </g>
  <g id="content-title-04">
    <text x="36" y="64" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="64" font-weight="700" fill="#0F172A">国内外研究现状</text>
    <rect x="36" y="76" width="72" height="3.5" rx="1.75" fill="#0C8ED1" opacity="0.8"/>
  </g>
  <g id="content-body-04">
    <rect x="36" y="104" width="1208" height="128" rx="24" fill="url(#row-grad-04)" stroke="#0C8ED1" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-04)"/>
    <rect x="36" y="104" width="4" height="128" rx="2" fill="#0C8ED1" opacity="0.8"/>
    <circle cx="68" cy="168" r="22" fill="none" stroke="#0C8ED1" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="68" cy="168" r="15" fill="#0C8ED1" fill-opacity="0.12"/>
    <text x="68" y="173" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" font-weight="700" fill="#20A2E5" text-anchor="middle">01</text>
    <circle cx="110" cy="144" r="4" fill="#0C8ED1" opacity="0.85"/>
    <text x="124" y="150" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#0F172A"><tspan x="124" dy="0">水文水动力模拟（SWMM、MIKE）：机理清晰，但建模成本高、难以</tspan><tspan x="124" dy="52">实时计算</tspan></text>
    <path d="M 1220 162 L 1226 168 L 1220 174" fill="none" stroke="#0C8ED1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <rect x="36" y="244" width="1208" height="128" rx="24" fill="url(#row-grad-04)" stroke="#0070B3" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-04)"/>
    <rect x="36" y="244" width="4" height="128" rx="2" fill="#0070B3" opacity="0.8"/>
    <circle cx="68" cy="308" r="22" fill="none" stroke="#0070B3" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="68" cy="308" r="15" fill="#0070B3" fill-opacity="0.12"/>
    <text x="68" y="313" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" font-weight="700" fill="#0070B3" text-anchor="middle">02</text>
    <circle cx="110" cy="284" r="4" fill="#0070B3" opacity="0.85"/>
    <text x="124" y="290" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#0F172A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#0070B3">统计与指数法（层次分析、熵权）</tspan><tspan fill="#E2E8F0" opacity="0.6">：</tspan>易落地，但静态权重无法反映降</tspan><tspan x="124" dy="52">雨过程</tspan></text>
    <path d="M 1220 302 L 1226 308 L 1220 314" fill="none" stroke="#0070B3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <rect x="36" y="384" width="1208" height="76" rx="24" fill="url(#row-grad-04)" stroke="#34B6F9" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-04)"/>
    <rect x="36" y="384" width="4" height="76" rx="2" fill="#34B6F9" opacity="0.8"/>
    <circle cx="68" cy="422" r="22" fill="none" stroke="#34B6F9" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="68" cy="422" r="15" fill="#34B6F9" fill-opacity="0.12"/>
    <text x="68" y="427" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" font-weight="700" fill="#20A2E5" text-anchor="middle">03</text>
    <circle cx="110" cy="424" r="4" fill="#34B6F9" opacity="0.85"/>
    <text x="124" y="430" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#0F172A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#20A2E5">机器学习方法</tspan><tspan fill="#E2E8F0" opacity="0.6">：</tspan>精度较高，但特征多为单源，普遍忽略管网拓扑结构</tspan></text>
    <path d="M 1220 416 L 1226 422 L 1220 428" fill="none" stroke="#34B6F9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <rect x="36" y="472" width="1208" height="76" rx="24" fill="url(#row-grad-04)" stroke="#0C8ED1" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-04)"/>
    <rect x="36" y="472" width="4" height="76" rx="2" fill="#0C8ED1" opacity="0.8"/>
    <circle cx="68" cy="510" r="22" fill="none" stroke="#0C8ED1" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="68" cy="510" r="15" fill="#0C8ED1" fill-opacity="0.12"/>
    <text x="68" y="515" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" font-weight="700" fill="#20A2E5" text-anchor="middle">04</text>
    <circle cx="110" cy="512" r="4" fill="#0C8ED1" opacity="0.85"/>
    <text x="124" y="518" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#0F172A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#20A2E5">共性缺口</tspan><tspan fill="#E2E8F0" opacity="0.6">：</tspan>多源异构数据融合不足，缺乏对管网连通性的显式建模</tspan></text>
    <path d="M 1220 504 L 1226 510 L 1220 516" fill="none" stroke="#0C8ED1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  </g>
</svg>