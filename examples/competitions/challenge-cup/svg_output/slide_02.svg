    <text x="1208" y="672" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" fill="#475569" text-anchor="end" opacity="0.7">02 / 16</text>
  </g>
  <g id="content-title-02">
    <text x="36" y="64" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="54" font-weight="700" fill="#0F172A">研究背景：内涝为何越来越常见</text>
    <rect x="36" y="76" width="72" height="3.5" rx="1.75" fill="#0284C7" opacity="0.8"/>
  </g>
  <g id="content-body-02">
    <rect x="36" y="104" width="1208" height="128" rx="24" fill="url(#row-grad-02)" stroke="#0284C7" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-02)"/>
    <rect x="36" y="104" width="4" height="128" rx="2" fill="#0284C7" opacity="0.8"/>
    <circle cx="68" cy="168" r="22" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="68" cy="168" r="15" fill="#0284C7" fill-opacity="0.12"/>
    <text x="68" y="173" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" font-weight="700" fill="#20A2E5" text-anchor="middle">01</text>
    <circle cx="110" cy="144" r="4" fill="#0284C7" opacity="0.85"/>
    <text x="124" y="150" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#0F172A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#20A2E5">2021</tspan><tspan fill="#E2E8F0" opacity="0.6">-</tspan>2025 年全国因城市内涝造成的直接经济损失年均超</tspan><tspan x="124" dy="52">1,600 亿元</tspan></text>
    <path d="M 1220 162 L 1226 168 L 1220 174" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <rect x="36" y="244" width="1208" height="128" rx="24" fill="url(#row-grad-02)" stroke="#0066A9" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-02)"/>
    <rect x="36" y="244" width="4" height="128" rx="2" fill="#0066A9" opacity="0.8"/>
    <circle cx="68" cy="308" r="22" fill="none" stroke="#0066A9" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="68" cy="308" r="15" fill="#0066A9" fill-opacity="0.12"/>
    <text x="68" y="313" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" font-weight="700" fill="#0066A9" text-anchor="middle">02</text>
    <circle cx="110" cy="284" r="4" fill="#0066A9" opacity="0.85"/>
    <text x="124" y="290" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#0F172A"><tspan x="124" dy="0"><tspan font-weight="700" fill="#0066A9">极端降雨频次上升</tspan><tspan fill="#E2E8F0" opacity="0.6">：</tspan>研究区 Z 市小时雨强超 50 毫米事件由年均</tspan><tspan x="124" dy="52">2.1 次增至 4.7 次</tspan></text>
    <path d="M 1220 302 L 1226 308 L 1220 314" fill="none" stroke="#0066A9" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <rect x="36" y="384" width="1208" height="76" rx="24" fill="url(#row-grad-02)" stroke="#2AACEF" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-02)"/>
    <rect x="36" y="384" width="4" height="76" rx="2" fill="#2AACEF" opacity="0.8"/>
    <circle cx="68" cy="422" r="22" fill="none" stroke="#2AACEF" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="68" cy="422" r="15" fill="#2AACEF" fill-opacity="0.12"/>
    <text x="68" y="427" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" font-weight="700" fill="#20A2E5" text-anchor="middle">03</text>
    <circle cx="110" cy="424" r="4" fill="#2AACEF" opacity="0.85"/>
    <text x="124" y="430" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#0F172A"><tspan x="124" dy="0">传统&quot;重末端、轻预警&quot;治理模式难以应对短历时强降雨</tspan></text>
    <path d="M 1220 416 L 1226 422 L 1220 428" fill="none" stroke="#2AACEF" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
    <rect x="36" y="472" width="1208" height="76" rx="24" fill="url(#row-grad-02)" stroke="#0284C7" stroke-opacity="0.25" stroke-width="1.5" filter="url(#card-shadow-02)"/>
    <rect x="36" y="472" width="4" height="76" rx="2" fill="#0284C7" opacity="0.8"/>
    <circle cx="68" cy="510" r="22" fill="none" stroke="#0284C7" stroke-width="1.5" stroke-opacity="0.25"/>
    <circle cx="68" cy="510" r="15" fill="#0284C7" fill-opacity="0.12"/>
    <text x="68" y="515" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="21" font-weight="700" fill="#20A2E5" text-anchor="middle">04</text>
    <circle cx="110" cy="512" r="4" fill="#0284C7" opacity="0.85"/>
    <text x="124" y="518" font-family="Roboto, Arial, 'Microsoft YaHei', 'PingFang SC', 'Noto Sans SC', 'Source Han Sans SC', sans-serif" font-size="36" fill="#0F172A"><tspan x="124" dy="0">街区尺度的内涝风险动态评估是海绵城市调度的关键前提</tspan></text>
    <path d="M 1220 504 L 1226 510 L 1220 516" fill="none" stroke="#0284C7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" opacity="0.5"/>
  </g>
